name: KiCad Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_IMAGE: kicad/kicad:10.0.8-full

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate schematic PDF
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p output
          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli sch export pdf -o output/schematic.pdf DCBus.kicad_sch

      - name: Generate BOM
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p output
          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli sch export bom --group-by "Footprint" --fields "Reference,Value,Footprint,QUANTITY,DNP,Datasheet" -o output/bom.csv DCBus.kicad_sch

      - name: Generate gerbers and drill files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/gerbers"
          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -v "$RUNNER_TEMP/gerbers:/gerbers" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli pcb export gerbers \
            --layers F.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts \
            -o /gerbers DCBus.kicad_pcb
          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -v "$RUNNER_TEMP/gerbers:/gerbers" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli pcb export drill --generate-report \
            --report-path /gerbers/DCBus-drill.rpt \
            -o /gerbers DCBus.kicad_pcb
          cd "$RUNNER_TEMP/gerbers"
          python3 -m zipfile -c ../DCBus-gerbers.zip *

      - name: Run ERC and DRC
        run: |
          mkdir -p output

          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli sch erc --severity-all \
            --format report \
            -o output/erc.rpt DCBus.kicad_sch

          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli sch erc --severity-all \
            --format json \
            -o output/erc.json DCBus.kicad_sch

          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli pcb drc --severity-all \
            --format report \
            -o output/drc.rpt DCBus.kicad_pcb

          docker run --rm --user root -e HOME=/home/kicad \
            -v "$PWD:/workspace" -w /workspace \
            "$KICAD_IMAGE" \
            kicad-cli pcb drc --severity-all \
            --format json \
            -o output/drc.json DCBus.kicad_pcb

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/DCBus-gerbers.zip
            output/schematic.pdf
            output/bom.csv
            output/erc.rpt
            output/erc.json
            output/drc.rpt
            output/drc.json
